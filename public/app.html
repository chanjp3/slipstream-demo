document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

egFormOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;inset:0;background:rgba(10,20,40,.55);display:flex;align-items:center;justify-content:center;z-index:3000\">\n  <div style=\"background:#fff;border-radius:18px;padding:24px;width:400px;max-width:94vw;box-shadow:0 24px 60px rgba(10,30,80,.35)\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center\">\n      <div style=\"font-size:18px;font-weight:800;color:#16233b\">Post an empty leg<\/div>\n      <button sc-camel-on-click=\"{{ closeLegForm }}\" style=\"border:none;background:#eef2f8;border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:13px;color:#4a5a76\">✕<\/button>\n    <\/div>\n    <div style=\"display:flex;gap:7px;margin-top:14px\">\n      <input value=\"{{ legFrom }}\" sc-camel-on-change=\"{{ onLegFrom }}\" placeholder=\"From (TEB)\" style=\"flex:1;min-width:0;border:1.5px solid #dde5f0;border-radius:9px;padding:9px 11px;font-size:13px;text-transform:uppercase\">\n      <input value=\"{{ legTo }}\" sc-camel-on-change=\"{{ onLegTo }}\" placeholder=\"To (PBI)\" style=\"flex:1;min-width:0;border:1.5px solid #dde5f0;border-radius:9px;padding:9px 11px;font-size:13px;text-transform:uppercase\">\n    <\/div>\n    <div style=\"display:flex;gap:7px;margin-top:7px\">\n      <input type=\"date\" value=\"{{ legDate }}\" sc-camel-on-change=\"{{ onLegDate }}\" style=\"flex:1;min-width:0;border:1.5px solid #dde5f0;border-radius:9px;padding:8px 11px;font-size:13px\">\n      <input type=\"time\" value=\"{{ legTime }}\" sc-camel-on-change=\"{{ onLegTime }}\" style=\"width:110px;border:1.5px solid #dde5f0;border-radius:9px;padding:8px 11px;font-size:13px\">\n    <\/div>\n    <sc-raw-select value=\"{{ legAircraft }}\" sc-camel-on-change=\"{{ onLegAircraft }}\" style=\"width:100%;margin-top:7px;border:1.5px solid #dde5f0;border-radius:9px;padding:9px 10px;font-size:13px;background:#fff;color:#16233b\">\n      <sc-for list=\"{{ fleet }}\" as=\"f\" hint-placeholder-count=\"4\">\n        <option value=\"{{ f.id }}\">{{ f.label }}<\/option>\n      <\/sc-for>\n    <\/sc-raw-select>\n    <input value=\"{{ legPrice }}\" sc-camel-on-change=\"{{ onLegPrice }}\" placeholder=\"All-in price (e.g. 9,500)\" style=\"width:100%;box-sizing:border-box;margin-top:7px;border:1.5px solid #dde5f0;border-radius:9px;padding:9px 11px;font-size:13px;font-weight:700\">\n    <input value=\"{{ legNote }}\" sc-camel-on-change=\"{{ onLegNote }}\" placeholder=\"Note (optional — e.g. repositioning after a charter)\" style=\"width:100%;box-sizing:border-box;margin-top:7px;border:1.5px solid #dde5f0;border-radius:9px;padding:9px 11px;font-size:12.5px\">\n    <button sc-camel-on-click=\"{{ postEmptyLeg }}\" style=\"width:100%;margin-top:12px;border:none;cursor:pointer;background:#2E6BE6;color:#fff;border-radius:10px;padding:11px;font-size:13.5px;font-weight:800\">Post to the board<\/button>\n    <sc-if value=\"{{ legMsg }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"margin-top:8px;font-size:12px;color:#b3261e;font-weight:600\">{{ legMsg }}<\/div>\n    <\/sc-if>\n  <\/div>\n<\/div>\n<\/sc-if>\n<sc-if value=\"{{ depOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;inset:0;background:rgba(10,20,40,.55);display:flex;align-items:center;justify-content:center;z-index:3000\">\n  <div style=\"background:#fff;border-radius:18px;padding:28px;width:380px;max-width:94vw;box-shadow:0 24px 60px rgba(10,30,80,.35)\">\n    <div style=\"font-size:11px;font-weight:800;letter-spacing:1.2px;color:#2E6BE6\">REQUEST DEPOSIT<\/div>\n    <div style=\"font-size:28px;font-weight:800;color:#16233b;margin-top:8px\">{{ depAmountText }}<\/div>\n    <div style=\"font-size:13px;color:#4a5a76;line-height:1.55;margin-top:10px\">A fully refundable hold placed when your request goes out. <b>Refunded 100%<\/b> if no operator can fly it or none of the offers work for you — it only becomes the platform fee when you accept one.<\/div>\n    <div style=\"margin-top:14px;padding:10px 12px;background:#fdf6e3;border-radius:10px;font-size:12px;color:#8a6d1f;font-weight:600;line-height:1.45\">Demo mode — no payment is processed and no card is required.<\/div>\n    <button sc-camel-on-click=\"{{ confirmDeposit }}\" style=\"width:100%;margin-top:14px;border:none;cursor:pointer;background:#2E6BE6;color:#fff;border-radius:10px;padding:12px;font-size:14px;font-weight:800\">Place hold &amp; send request<\/button>\n    <button sc-camel-on-click=\"{{ cancelDeposit }}\" style=\"width:100%;margin-top:8px;border:none;cursor:pointer;background:#eef2f8;color:#4a5a76;border-radius:10px;padding:10px;font-size:13px;font-weight:700\">Cancel<\/button>\n  <\/div>\n<\/div>\n<\/sc-if>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;defaultRole&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;client&quot;,&quot;operator&quot;],&quot;default&quot;:&quot;client&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;showEmptyLegDeals&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Marketplace&quot;}}\">\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.mapRef = React.createRef();\n    this.CATS = [\n      { id: 'prop', label: 'Turboprop', seats: '4–8' }, { id: 'light', label: 'Light jet', seats: '5–7' },\n      { id: 'mid', label: 'Midsize', seats: '7–9' }, { id: 'smid', label: 'Super-mid', seats: '8–10' },\n      { id: 'heavy', label: 'Heavy', seats: '10–16' }, { id: 'ulr', label: 'Ultra-long', seats: '12–18' }\n    ];\n    this.BUDGETS = ['Under $15k', '$15–30k', '$30–60k', '$60k+', 'Flexible'];\n    this.NEEDS = ['Pet on board', 'Medical equipment', 'Extra baggage', 'Wheelchair access'];\n    this.ADDONS = ['Catering', 'Ground transport', 'Wi-Fi required'];\n    this.me = null;\n    this.state = {\n      role: (props.defaultRole === 'operator') ? 'operator' : 'client',\n      view: (props.defaultRole === 'operator') ? 'operator' : 'request',\n      userInitials: (props.defaultRole === 'operator') ? 'OP' : 'TR',\n      tripType: 'oneway',\n      legs: [{ from: null, to: null, date: '2026-09-14', time: '09:00' }],\n      returnDate: '2026-09-18', returnTime: '17:00',\n      pax: 4, flexDays: '0', cats: ['light'], budget: '$15–30k',\n      needs: [], addons: [], notes: '',\n      active: { leg: 0, side: 'from' },\n      visible: [], visibleCount: 0,\n      requests: [], marketplace: [],\n      activeReqId: null,\n      compare: [], accepted: {}, chatWith: null, chatText: '',\n      chats: {},\n      opSelId: null, opBids: {}, inbox: [],\n      bidAircraft: '', bidPrice: '', bidMsg: '', bidEmpty: false, bidValid: '48',\n      menuOpen: false, profileName: '', pwCurrent: '', pwNew: '', acctMsg: '', showEL: true,\n      ctLink: '', ctMsg: '', checkoutOpen: false, apSearch: '',\n      profileOpen: false, prCompany: '', prCert: '', prBase: '', prTail: '', prModel: '', prMsg: '',\n      prSafety: '',\n      rvFor: null, rvStars: 0, rvText: '', rvMsg: '',\n      emptyLegs: [], myLegs: [],\n      legFormOpen: false, legFrom: '', legTo: '', legDate: '', legTime: '09:00',\n      legAircraft: '', legPrice: '', legNote: '', legMsg: '',\n      depOpen: false, depAmount: 0,\n      apOpen: false, mapOpen: false,\n      opView: 'desk', expEdits: {}, expMsg: '',\n      conOpen: false, conTopic: 'trip', conReqId: null, conMsg: '', conPhone: '', conBusy: false, conDone: '', conErr: '',\n      staffOpen: false, staffTab: 'messages', opNotes: {}, opReasons: {}, opExpiry: {}, staffMsg: '',\n      rsMsg: '', rsErr: '', rsBusy: false\n    };\n    this.opStats = null;\n    this.DEPOSIT_TIERS = { prop: 150, light: 150, mid: 250, smid: 250, heavy: 500, ulr: 500 };\n    this.opProfile = null;\n  }\n  ap(code) { return this.airports ? this.airports.find(a => a.iata === code) : null; }\n  fmtDate(d) { const dt = new Date(d + 'T12:00'); return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }\n  fmtPrice(p) { return '$' + p.toLocaleString('en-US'); }\n  // 'YYYY-MM-DD' as a full date; expiry dates are compared and shown in UTC.\n  fmtDay(d) { return new Date(d + 'T00:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' }); }\n  // Where a declared safety rating stands: mirrors ratingState() in the worker.\n  ratingState(pr) {\n    if (!pr || !pr.safety_program) return { claimed: null };\n    const today = new Date().toISOString().slice(0, 10);\n    const confirmed = pr.safety_verified === pr.safety_program;\n    const expires = confirmed ? pr.safety_expires || null : null;\n    const expired = confirmed && (!expires || expires < today);\n    return {\n      claimed: pr.safety_program, hasDoc: !!pr.safety_doc_name, confirmed, expires, expired,\n      daysLeft: expires && !expired ? Math.round((Date.parse(expires) - Date.parse(today)) / 86400000) : null,\n      newDoc: confirmed && !!pr.safety_doc_at && !!pr.safety_verified_at && pr.safety_doc_at > pr.safety_verified_at\n    };\n  }\n\n  // Cabin class for the quote-card art, from the model name first (operators\n  // type free text) and the seat count as a fallback.\n  acClass(name, seats) {\n    const m = (name || '').toLowerCase();\n    if (/king air|pc-?12|tbm|caravan|kodiak|avanti|cheyenne|conquest|meridian|m[56]00|turboprop/.test(m)) return 'prop';\n    if (/challenger 3|sovereign|latitude|longitude|xls|excel|citation x|hawker|praetor|legacy [45]|g280|g200|learjet 6|falcon 50/.test(m)) return 'mid';\n    if (/gulfstream|\\bg[2-7]\\d0|global|falcon (7|8|9|2000)|challenger (6|8)|legacy 6|lineage|bbj|acj/.test(m)) return 'heavy';\n    if (/phenom|cj\\d|citation m2|mustang|bravo|encore|learjet [347]|hondajet|eclipse|premier|beechjet|nextant|pc-?24|sf50|vision/.test(m)) return 'light';\n    const s = parseInt(seats, 10) || 0;\n    return s >= 12 ? 'heavy' : s >= 8 ? 'mid' : 'light';\n  }\n\n  // Side-profile silhouette on navy, shown until the operator uploads a photo.\n  // Returned as a data URI so the template can bind it to an <img>.\n  acArt(kind) {\n    this._art = this._art || {};\n    if (this._art[kind]) return this._art[kind];\n    const NAVY = '#16233B', BODY = '#F3EEE3', SHADE = '#DDD5C4';\n    const spec = { prop: { L: 236, D: 34, win: 5, prop: true }, light: { L: 256, D: 30, win: 5 }, mid: { L: 300, D: 33, win: 7 }, heavy: { L: 348, D: 37, win: 9 } }[kind];\n    const { L, D, win } = spec;\n    const r1 = v => Math.round(v * 10) / 10;\n    const W = 440, H = 280, cy = 146, x0 = (W - L) / 2, yt = cy - D / 2, yb = cy + D / 2, fin = 1.55 * D;\n    const X = f => r1(x0 + f * L), Y = f => r1(cy + f * D);\n    const fuselage = 'M' + X(0) + ',' + Y(-0.3) + ' L' + X(0.18) + ',' + r1(yt) + ' L' + X(0.78) + ',' + r1(yt)\n      + ' C' + X(0.88) + ',' + r1(yt) + ' ' + X(0.95) + ',' + Y(-0.12) + ' ' + X(1) + ',' + Y(0.14)\n      + ' C' + X(0.96) + ',' + Y(0.42) + ' ' + X(0.9) + ',' + r1(yb) + ' ' + X(0.84) + ',' + r1(yb)\n      + ' L' + X(0.42) + ',' + r1(yb) + ' C' + X(0.25) + ',' + r1(yb) + ' ' + X(0.1) + ',' + Y(0.05) + ' ' + X(0) + ',' + Y(-0.16) + ' Z';\n    const sy = r1(yt - fin - 1);\n    let parts = '<polygon points=\"' + [X(0.25) + ',' + r1(yt + 3), X(0.06) + ',' + r1(yt + 3), X(-0.04) + ',' + r1(yt - fin), X(0.075) + ',' + r1(yt - fin)].join(' ') + '\" fill=\"' + BODY + '\"/>'\n      + '<path d=\"M' + X(-0.09) + ',' + sy + ' Q' + X(0.01) + ',' + r1(sy - 6) + ' ' + X(0.12) + ',' + sy + ' Q' + X(0.01) + ',' + r1(sy + 5) + ' ' + X(-0.09) + ',' + sy + ' Z\" fill=\"' + BODY + '\"/>'\n      + '<path d=\"' + fuselage + '\" fill=\"' + BODY + '\"/>'\n      + '<polygon points=\"' + [X(0.64) + ',' + r1(yb - 5), X(0.5) + ',' + r1(yb - 3), X(0.355) + ',' + r1(yb + 21), X(0.4) + ',' + r1(yb + 21)].join(' ') + '\" fill=\"' + SHADE + '\"/>'\n      + '<polygon points=\"' + [X(0.355) + ',' + r1(yb + 21), X(0.325) + ',' + r1(yb + 1), X(0.34) + ',' + r1(yb + 1), X(0.385) + ',' + r1(yb + 21)].join(' ') + '\" fill=\"' + SHADE + '\"/>';\n    if (spec.prop) {\n      const ny = r1(yb - 1), a = X(0.5), b = X(0.73);\n      parts += '<rect x=\"' + a + '\" y=\"' + r1(ny - 8) + '\" width=\"' + r1(b - a) + '\" height=\"16\" rx=\"8\" fill=\"' + SHADE + '\" stroke=\"' + NAVY + '\" stroke-width=\"2\"/>'\n        + '<path d=\"M' + b + ',' + r1(ny - 5) + ' L' + r1(b + 9) + ',' + ny + ' L' + b + ',' + r1(ny + 5) + ' Z\" fill=\"' + SHADE + '\"/>'\n        + '<ellipse cx=\"' + r1(b + 4) + '\" cy=\"' + ny + '\" rx=\"2.2\" ry=\"' + r1(D * 0.95) + '\" fill=\"' + BODY + '\" opacity=\".85\"/>';\n    } else {\n      const eh = r1(D * 0.62);\n      parts += '<rect x=\"' + X(0.2) + '\" y=\"' + r1(yt - eh * 0.45) + '\" width=\"' + r1(0.18 * L) + '\" height=\"' + eh + '\" rx=\"' + r1(eh / 2) + '\" fill=\"' + SHADE + '\" stroke=\"' + NAVY + '\" stroke-width=\"2\"/>';\n    }\n    const wa = x0 + 0.4 * L, wb = x0 + 0.74 * L;\n    for (let i = 0; i < win; i++) {\n      const wx = wa + ((wb - wa) * i) / (win - 1);\n      parts += spec.prop\n        ? '<circle cx=\"' + r1(wx) + '\" cy=\"' + Y(-0.16) + '\" r=\"4.6\" fill=\"' + NAVY + '\"/>'\n        : '<rect x=\"' + r1(wx - 4.5) + '\" y=\"' + Y(-0.36) + '\" width=\"9\" height=\"12\" rx=\"4.2\" fill=\"' + NAVY + '\"/>';\n    }\n    parts += '<polygon points=\"' + [X(0.8) + ',' + r1(yt + 4), X(0.865) + ',' + Y(-0.2), X(0.9) + ',' + Y(0), X(0.81) + ',' + Y(-0.04)].join(' ') + '\" fill=\"' + NAVY + '\"/>';\n    const svg = '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 ' + W + ' ' + H + '\" preserveAspectRatio=\"xMidYMid slice\">'\n      + '<rect width=\"' + W + '\" height=\"' + H + '\" fill=\"' + NAVY + '\"/>'\n      + '<line x1=\"56\" y1=\"212\" x2=\"384\" y2=\"212\" stroke=\"#C6A667\" stroke-width=\"1.5\" opacity=\".6\"/>' + parts + '<\/svg>';\n    return (this._art[kind] = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg));\n  }\n  routeStr(r) { const codes = [r.legs[0].from, ...r.legs.map(l => l.to)]; if (r.type === 'round') return r.legs[0].from + ' ⇄ ' + r.legs[0].to; return codes.join(' → '); }\n\n  api(path, opts) {\n    return fetch(path, opts && opts.body ? {\n      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(opts.body)\n    } : undefined).then(r => r.json().then(d => {\n      if (!r.ok) { const e = new Error(d.error || 'Request failed'); e.code = d.code; throw e; }\n      return d;\n    }));\n  }\n\n  // Aircraft this operator may offer: matched to the FAA registry and listed on\n  // the verified certificate. Empty until the operator passes the FAA check.\n  quotable() {\n    const p = this.opProfile;\n    if (!p || !p.clearance || !p.clearance.ok) return [];\n    return p.fleet.filter(a => p.clearance.cleared.includes(a.tail));\n  }\n  // The two checks behind the quoting gate, with what is still missing.\n  gateSteps() {\n    const p = this.opProfile;\n    const c = (p && p.clearance) || { ok: false, certOk: false, cleared: [], autoOk: false, review: 'pending', reason: 'cert_missing' };\n    const prof = (p && p.profile) || {};\n    const fleet = p ? p.fleet : [];\n    const certHint = c.certOk ? 'Matched to ' + prof.cert_faa_name + ' (' + prof.cert_number + ')'\n      : prof.cert_number ? prof.cert_number + ' is not on the FAA Part 135 holders list. Check the designator.'\n      : 'Add your certificate number to the operator profile and save.';\n    const matched = fleet.filter(a => a.faa_status === 'verified');\n    const acHint = c.cleared.length ? c.cleared.length + ' of ' + fleet.length + ' cleared to offer: ' + c.cleared.join(', ')\n      : !fleet.length ? 'Add the aircraft you operate, then run the FAA check.'\n      : fleet.every(a => !a.faa_status || a.faa_status === 'pending') ? 'Run the FAA check on your fleet.'\n      : matched.length && !c.certOk ? 'Your aircraft match the registry. They are checked against your certificate once it is verified.'\n      : matched.length ? 'Your aircraft match the registry but are not on certificate ' + prof.cert_number + ' in the FAA list. If your D085 changed recently, message the partner desk: we can clear an aircraft against your documents.'\n      : 'No aircraft has passed yet. See the note beside each tail number, or message the partner desk.';\n    const missingDocs = [!prof.cert_doc_name && 'air carrier certificate', !prof.d085_name && 'D085'].filter(Boolean);\n    const reviewHint = c.review === 'approved' ? 'Approved for certificate ' + prof.cert_number + '.'\n      : c.review === 'declined' ? (prof.review_reason ? 'What we need: ' + prof.review_reason : 'We could not yet confirm that this account belongs to the certificate holder.')\n      : c.autoOk ? 'In review. A member of our team confirms this account belongs to the certificate holder, and you get an email when it is done.'\n        + (missingDocs.length ? ' Uploading your ' + missingDocs.join(' and ') + ' speeds this up.' : '')\n      : 'Starts on its own once the two checks above pass.';\n    const look = (state, n) => state === 'done' ? { mark: '✓', bg: '#e8f6ee', fg: '#1e5e3c', bd: '#9fd8b6' }\n      : state === 'wait' ? { mark: '…', bg: '#fbf8f0', fg: '#8a6b2e', bd: '#e6dcc3' }\n      : state === 'stop' ? { mark: '!', bg: '#fdecec', fg: '#b3261e', bd: '#f3b9b4' }\n      : { mark: String(n), bg: '#ffffff', fg: '#68758d', bd: '#cfd8e6' };\n    return [\n      { label: 'Part 135 certificate matched to the FAA list', hint: certHint, ...look(c.certOk ? 'done' : 'todo', 1) },\n      { label: 'An aircraft matched to the FAA registry and your certificate', hint: acHint, ...look(c.cleared.length ? 'done' : 'todo', 2) },\n      { label: 'Account confirmed by the Chartavia team', hint: reviewHint,\n        ...look(c.review === 'approved' ? 'done' : c.review === 'declined' ? 'stop' : c.autoOk ? 'wait' : 'todo', 3) }\n    ];\n  }\n\n  loadData() {\n    return this.api('/

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password — Slipstream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Albert Sans', -apple-system, BlinkMacSystemFont, sans-serif; background: #2E6BE6; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: #fff; border-radius: 20px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 24px 60px rgba(10,30,80,.35); }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .logo-mark { width: 34px; height: 34px; border-radius: 9px; background: #2E6BE6; display: flex; align-items: center; justify-content: center; }
    .logo-mark svg { width: 20px; height: 20px; }
    .logo-name { font-size: 20px; font-weight: 800; color: #16233b; letter-spacing: -.3px; }
    .tagline { color: #68758d; font-size: 14px; margin-bottom: 24px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #4a5a76; margin: 16px 0 6px; }
    input { width: 100%; padding: 12px 14px; font-size: 15px; font-family: inherit; border: 1px solid #dde5f0; border-radius: 10px; color: #16233b; outline: none; }
    input:focus { border-color: #2E6BE6; }
    button { width: 100%; margin-top: 24px; padding: 13px; font-size: 15px; font-weight: 700; font-family: inherit; color: #fff; background: #2E6BE6; border: none; border-radius: 10px; cursor: pointer; }
    button:hover { background: #2558c4; }
    button:disabled { background: #a9b4c8; cursor: default; }
    .msg { display: none; margin-top: 16px; padding: 12px 14px; font-size: 13px; border-radius: 8px; line-height: 1.5; }
    .msg.ok { background: #e8f6ee; color: #1e5e3c; }
    .msg.err { background: #fdecec; color: #b3261e; }
    .alt { margin-top: 20px; text-align: center; font-size: 14px; color: #68758d; }
    .alt a { color: #2E6BE6; font-weight: 600; text-decoration: none; }
  </style>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2E6BE6">
  <link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-mark"><svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg"><rect x="38" y="42" width="46" height="6" rx="3" fill="#ffffff" transform="rotate(-20 60 45)"></rect><rect x="32" y="52" width="26" height="6" rx="3" fill="#a8c4f4" transform="rotate(-20 45 55)"></rect></svg></div>
      <div class="logo-name">Slipstream</div>
    </div>
    <div class="tagline">Choose a new password for your account.</div>
    <form id="form">
      <label for="pw1">New password <span style="font-weight:400;color:#a9b4c8">(min. 8 characters)</span></label>
      <input id="pw1" type="password" autocomplete="new-password" minlength="8" required>
      <label for="pw2">Repeat new password</label>
      <input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
      <div class="msg" id="msg"></div>
      <button type="submit" id="submit">Set new password</button>
    </form>
    <div class="alt"><a href="/login">Back to sign in</a></div>
  </div>
  <script>
    const token = new URLSearchParams(location.search).get('token') || '';
    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submit');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.style.display = 'none';
      const p1 = document.getElementById('pw1').value, p2 = document.getElementById('pw2').value;
      if (p1 !== p2) {
        msg.className = 'msg err'; msg.textContent = 'Passwords don\'t match.'; msg.style.display = 'block';
        return;
      }
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        const res = await fetch('/api/reset', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ token, password: p1 }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Something went wrong');
        msg.className = 'msg ok';
        msg.innerHTML = 'Password updated — every signed-in session was logged out for safety. <a href="/login">Sign in with your new password</a>.';
        msg.style.display = 'block';
        form.querySelectorAll('input,button').forEach((el) => el.disabled = true);
      } catch (err) {
        msg.className = 'msg err';
        msg.textContent = err.message;
        msg.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Set new password';
      }
    });
  </script>
</body>
</html>

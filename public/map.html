    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only

    // opaque contexts — file:// — everything serializes as 'null', where

      // and sender identity (own child frame / direct parent) is checked

    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};

    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }

      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

        }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<style>/* required styles */\r\n\r\n.leaflet-pane,\r\n.leaflet-tile,\r\n.leaflet-marker-icon,\r\n.leaflet-marker-shadow,\r\n.leaflet-tile-container,\r\n.leaflet-pane > svg,\r\n.leaflet-pane > canvas,\r\n.leaflet-zoom-box,\r\n.leaflet-image-layer,\r\n.leaflet-layer {\r\n\tposition: absolute;\r\n\tleft: 0;\r\n\ttop: 0;\r\n\t}\r\n.leaflet-container {\r\n\toverflow: hidden;\r\n\t}\r\n.leaflet-tile,\r\n.leaflet-marker-icon,\r\n.leaflet-marker-shadow {\r\n\t-webkit-user-select: none;\r\n\t   -moz-user-select: none;\r\n\t        user-select: none;\r\n\t  -webkit-user-drag: none;\r\n\t}\r\n/* Prevents IE11 from highlighting tiles in blue */\r\n.leaflet-tile::selection {\r\n\tbackground: transparent;\r\n}\r\n/* Safari renders non-retina tile on retina better with this, but Chrome is worse */\r\n.leaflet-safari .leaflet-tile {\r\n\timage-rendering: -webkit-optimize-contrast;\r\n\t}\r\n/* hack that prevents hw layers \"stretching\" when loading new tiles */\r\n.leaflet-safari .leaflet-tile-container {\r\n\twidth: 1600px;\r\n\theight: 1600px;\r\n\t-webkit-transform-origin: 0 0;\r\n\t}\r\n.leaflet-marker-icon,\r\n.leaflet-marker-shadow {\r\n\tdisplay: block;\r\n\t}\r\n/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */\r\n/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */\r\n.leaflet-container .leaflet-overlay-pane svg {\r\n\tmax-width: none !important;\r\n\tmax-height: none !important;\r\n\t}\r\n.leaflet-container .leaflet-marker-pane img,\r\n.leaflet-container .leaflet-shadow-pane img,\r\n.leaflet-container .leaflet-tile-pane img,\r\n.leaflet-container img.leaflet-image-layer,\r\n.leaflet-container .leaflet-tile {\r\n\tmax-width: none !important;\r\n\tmax-height: none !important;\r\n\twidth: auto;\r\n\tpadding: 0;\r\n\t}\r\n\r\n.leaflet-container img.leaflet-tile {\r\n\t/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */\r\n\tmix-blend-mode: plus-lighter;\r\n}\r\n\r\n.leaflet-container.leaflet-touch-zoom {\r\n\t-ms-touch-action: pan-x pan-y;\r\n\ttouch-action: pan-x pan-y;\r\n\t}\r\n.leaflet-container.leaflet-touch-drag {\r\n\t-ms-touch-action: pinch-zoom;\r\n\t/* Fallback for FF which doesn't support pinch-zoom */\r\n\ttouch-action: none;\r\n\ttouch-action: pinch-zoom;\r\n}\r\n.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {\r\n\t-ms-touch-action: none;\r\n\ttouch-action: none;\r\n}\r\n.leaflet-container {\r\n\t-webkit-tap-highlight-color: transparent;\r\n}\r\n.leaflet-container a {\r\n\t-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);\r\n}\r\n.leaflet-tile {\r\n\tfilter: inherit;\r\n\tvisibility: hidden;\r\n\t}\r\n.leaflet-tile-loaded {\r\n\tvisibility: inherit;\r\n\t}\r\n.leaflet-zoom-box {\r\n\twidth: 0;\r\n\theight: 0;\r\n\t-moz-box-sizing: border-box;\r\n\t     box-sizing: border-box;\r\n\tz-index: 800;\r\n\t}\r\n/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */\r\n.leaflet-overlay-pane svg {\r\n\t-moz-user-select: none;\r\n\t}\r\n\r\n.leaflet-pane         { z-index: 400; }\r\n\r\n.leaflet-tile-pane    { z-index: 200; }\r\n.leaflet-overlay-pane { z-index: 400; }\r\n.leaflet-shadow-pane  { z-index: 500; }\r\n.leaflet-marker-pane  { z-index: 600; }\r\n.leaflet-tooltip-pane   { z-index: 650; }\r\n.leaflet-popup-pane   { z-index: 700; }\r\n\r\n.leaflet-map-pane canvas { z-index: 100; }\r\n.leaflet-map-pane svg    { z-index: 200; }\r\n\r\n.leaflet-vml-shape {\r\n\twidth: 1px;\r\n\theight: 1px;\r\n\t}\r\n.lvml {\r\n\tbehavior: url(#default#VML);\r\n\tdisplay: inline-block;\r\n\tposition: absolute;\r\n\t}\r\n\r\n\r\n/* control positioning */\r\n\r\n.leaflet-control {\r\n\tposition: relative;\r\n\tz-index: 800;\r\n\tpointer-events: visiblePainted; /* IE 9-10 doesn't have auto */\r\n\tpointer-events: auto;\r\n\t}\r\n.leaflet-top,\r\n.leaflet-bottom {\r\n\tposition: absolute;\r\n\tz-index: 1000;\r\n\tpointer-eve -title{font-weight:800;font-size:10px;letter-spacing:.8px;color:#8593ab;margin-bottom:5px}\n#legend .lg-row{display:flex;align-items:center;gap:7px;margin:3px 0}\n#legend .lg-sw{width:13px;height:13px;border-radius:4px;border:1.5px solid;flex-shrink:0}\n#legend .lg-dot{width:13px;height:13px;border-radius:50%;background:rgba(46,107,230,.92);box-shadow:0 0 0 2.5px rgba(46,107,230,.22);flex-shrink:0}\n.ap-chip.t1{background:#2E6BE6;color:#fff;border-color:#2E6BE6}\n.ap-chip:hover{border-color:#2E6BE6;box-shadow:0 2px 8px rgba(46,107,230,.35)}\n.ap-cluster div{display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(46,107,230,.92);color:#fff;font:700 12px system-ui,sans-serif;box-shadow:0 0 0 5px rgba(46,107,230,.22),0 2px 6px rgba(22,35,59,.25);transform:translate(-50%,-50%);cursor:pointer;transition:box-shadow .15s}\n.ap-cluster div:hover{box-shadow:0 0 0 8px rgba(46,107,230,.3),0 2px 8px rgba(22,35,59,.3)}\n@keyframes ap-pop{0%{transform:translate(-50%,-50%) scale(.25);opacity:0}70%{transform:translate(-50%,-50%) scale(1.08);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}\n.ap-chip.pop,.ap-cluster div.pop{animation:ap-pop .38s cubic-bezier(.2,.8,.3,1.15) both}\n<\/style>\n<link href=\"https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Quicksand:wght@600;700&display=swap\" rel=\"stylesheet\">\n<style>body,#legend,.leaflet-container{font-family:'Albert Sans',system-ui,sans-serif}\n.ap-cluster div,#legend .lg-title{font-family:'Quicksand','Albert Sans',system-ui,sans-serif}<\/style>\n<style>/*map-dark*/\n#map{background:#0f1a2e}\n.leaflet-tile-pane{filter:invert(1) sepia(.85) hue-rotate(176deg) saturate(1.05) brightness(.92) contrast(1.02)}\n#legend{background:rgba(22,35,59,.92);color:#c9d6ee;box-shadow:0 3px 14px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08)}\n#legend .lg-title{color:#8fa3c8}\n.leaflet-bar{border:none !important;box-shadow:0 3px 12px rgba(0,0,0,.4)}\n.leaflet-bar a,.leaflet-bar a:hover{background:#16233b;color:#fff;border-bottom-color:rgba(255,255,255,.12)}\n.leaflet-bar a.leaflet-disabled{background:#1b2a45;color:#5d6f92}\n.leaflet-control-attribution{background:rgba(15,26,46,.72) !important;color:#8fa3c8}\n.leaflet-control-attribution a{color:#a8c4f4}\n<\/style>\n<\/head>\n<body>\n\n<div id=\"map\"><\/div>\n<div id=\"legend\">\n  <div class=\"lg-title\">AIRPORTS<\/div>\n  <div class=\"lg-row\"><span class=\"lg-sw\" style=\"background:#2E6BE6;border-color:#2458c0\"><\/span>International<\/div>\n  <div class=\"lg-row\"><span class=\"lg-sw\" style=\"background:#fff;border-color:#c6d2e6\"><\/span>Regional / GA<\/div>\n  <div class=\"lg-row\"><span class=\"lg-sw\" style=\"background:#fdf6e3;border-color:#e0cf9a\"><\/span>Private (PPR)<\/div>\n  <div class=\"lg-row\"><span class=\"lg-dot\"><\/span>Multiple airports<\/div>\n<\/div>\n<script>\nvar APS = window.AIRPORTS.map(function(r){ return { iata:r[0], name:r[1], city:r[2], cc:r[3], lat:r[4], lon:r[5], tier:r[6], cat:r[7] }; });\nvar map = L.map('map', { worldCopyJump:true, zoomControl:false }).setView([38,-30], 3);\nL.control.zoom({ position: 'bottomright' }).addTo(map);\n(function(){\n  var token = window.__MAP && window.__MAP.mapboxToken;\n  if (token) {\n    document.documentElement.classList.add('mapbox');\n    map.getPane('tilePane').style.filter = 'none';\n    L.tileLayer('https://api.mapbox.com/styles/v1/mapbox/dark-v11/tiles/512/{z}/{x}/{y}{r}?access_token=' + encodeURIComponent(token), {\n      tileSize:512, zoomOffset:-1, maxZoom:12,\n      attribution:'<a href=\"https://www.mapbox.com/about/maps/\" target=\"_blank\">© Mapbox<\/a> <a href=\"https://www.openstreetmap.org/copyright\" target=\"_blank\">© OpenStreetMap<\/a> <a href=\"https://www.mapbox.com/map-feedback/\" target=\"_blank\">Improve this map<\/a>'\n    }).addTo(map);\n  } else {\n    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'© OpenStreetMap contributors', maxZoom:12 }).addTo(map);\n  }\n})();\nvar markerLayer = L.layerGroup().addTo(map);\n(function(){/*map-resize*/\n  var el = document.getElementById('map'), last = '';\n  function check(){\n    var key = el.clientWidth + 'x' + el.clientHeight;\n    if (!el.clientWidth || !el.clientHeight || key === last) return;\n    last = key;\n    map.invalidateSize(false);\n    if (typeof rebuild === 'function') { rebuild(); if (typeof postVisible === 'function') postVisible(); }\n  }\n  if (window.ResizeObserver) new ResizeObserver(check).observe(el);\n  var n = 0, t = setInterval(function(){ check(); if (++n > 40) clearInterval(t); }, 250);\n  window.addEventListener('load', check);\n})();\nfunction arcPoints(a, b){\n  var A = L.latLng(a), B = L.latLng(b);\n  var dx = B.lng - A.lng, dy = B.lat - A.lat, len = Math.sqrt(dx*dx + dy*dy);\n  if (!len) return [A, B];\n  var nx = -dy / len, ny = dx / len;\n  if (ny < 0) { nx = -nx; ny = -ny; }\n  var lift = Math.min(len * 0.2, 14);\n  var cx = (A.lng + B.lng) / 2 + nx * lift, cy = Math.min((A.lat + B.lat) / 2 + ny * lift, 84);\n  var out = [];\n  for (var i = 0; i <= 48; i++) { var t = i / 48, u = 1 - t; out.push([u*u*A.lat + 2*u*t*cy + t*t*B.lat, u*u*A.lng + 2*u*t*cx + t*t*B.lng]); }\n  return out;\n}\nvar routeLayer = L.layerGroup().addTo(map);\nfunction post(msg){ parent.postMessage(msg, '*'); }\nfunction rebuild(){\n  markerLayer.clearLayers();\n  var zoom = map.getZoom(), MAX_MARKERS = zoom <= 4 ? 19 : zoom === 5 ? 45 : 94, cell = zoom <= 4 ? 74 : zoom === 5 ? 55 : 36, grid = {};\n  var nowTs = Date.now();\n  if (window.__zoomAt === undefined || zoom !== window.__lastZoom) { window.__lastZoom = zoom; window.__zoomAt = nowTs; }\n  var anim = (nowTs - window.__zoomAt) < 700;\n  var vb = map.getBounds().pad(0.2);\n  var pts = APS.filter(function(a){ return vb.contains([a.lat, a.lon]); });\n  for (;;) {\n    grid = {};\n    pts.forEach(function(a){\n      var p = map.project([a.lat, a.lon], zoom);\n      var k = Math.floor(p.x/cell) + ':' + Math.floor(p.y/cell);\n      (grid[k] = grid[k] || []).push(a);\n    });\n    if (Object.keys(grid).length <= MAX_MARKERS || cell > 60000) break;\n    cell *= 1.6;\n  }\n  Object.keys(grid).forEach(function(k){\n    var g = grid[k];\n    if (g.length === 1){\n      var a = g[0];\n      L.marker([a.lat, a.lon], { icon: L.divIcon({ className:'ap-pin', html:'<div class=\"ap-chip cat-' + (a.cat||'r') + (anim?' pop':'') + '\"' + (anim?' style=\"animation-delay:' + (Math.random()*.15).toFixed(2) + 's\"':'') + '>' + a.iata + '<\/div>', iconSize:[0,0] }) })\n        .on('click', function(){ post({ type:'pick', airport:a }); })\n        .addTo(markerLayer);\n    } else {\n      var lat = 0, lon = 0;\n      g.forEach(function(a){ lat += a.lat; lon += a.lon; });\n      lat /= g.length; lon /= g.length;\n      var n = g.length, s = Math.min(64, Math.round(24 + 4.5 * Math.sqrt(n))), fsz = Math.max(11, Math.min(15, Math.round(s / 3.6)));\n      L.marker([lat, lon], { icon: L.divIcon({ className:'ap-cluster', html:'<div class=\"' + (anim?'pop':'') + '\" style=\"width:' + s + 'px;height:' + s + 'px;font-size:' + fsz + 'px' + (anim?';animation-delay:' + (Math.random()*.15).toFixed(2) + 's':'') + '\">' + n + '<\/div>', iconSize:[0,0] }) })\n        .on('click', function(){ var cb = L.latLngBounds(g.map(function(a){ return [a.lat, a.lon]; })).pad(0.2); if (map.getBoundsZoom(cb) <= map.getZoom() + 1) { map.flyTo([lat, lon], map.getZoom() + 2, { duration: 0.8 }); } else { map.flyToBounds(cb, { duration: 0.8 }); } })\n        .addTo(markerLayer);\n    }\n  });\n}\nfunction postVisible(){\n  var b = map.getBounds();\n  var inView = APS.filter(function(a){ return b.contains([a.lat, a.lon]); });\n  inView.sort(function(x,y){ return x.tier - y.tier || x.name.localeCompare(y.name); });\n  post({ type:'visible', count: inView.length, list: inView.slice(0, 30) });\n}\nmap.on('moveend zoomend', function(){ rebuild(); postVisible(); });\nwindow.addEventListener('message', function(e){\n  var d = e.data || {};\n  if (d.type === 'routes'){\n    routeLayer.clearLayers();\n    var pts = [];\n    (d.segs || []).forEach(function(sg){\n      if (sg.f && sg.t) {\n        var arc = arcPoints(sg.f, sg.t);\n        L.polyline(arc, { color:'#A8C4F4', weight:9, opacity:.16, lineCap:'round', interactive:false }).addTo(routeLayer);\n        L.polyline(arc, { color:'#A8C4F4', weight:2.5, opacity:.95, lineCap:'round', interactive:false }).addTo(routeLayer);\n      }\n      if (sg.f){ L.circleMarker(sg.f, { radius:5, color:'#A8C4F4', fillColor:'#0f1a2e', fillOpacity:1, weight:2.5 }).addTo(routeLayer); pts.push(sg.f); }\n      if (sg.t){ L.circleMarker(sg.t, { radius:5, color:'#A8C4F4', fillColor:'#A8C4F4', fillOpacity:1, weight:2.5 }).addTo(routeLayer); pts.push(sg.t); }\n    });\n    if (d.fit && pts.length >= 2) map.fitBounds(L.latLngBounds(pts).pad(0.45));\n  }\n});\nrebuild();\npostVisible();\npost({ type:'ready' });\n<\/script>\n\n\n<\/body><\/html>"</script>
